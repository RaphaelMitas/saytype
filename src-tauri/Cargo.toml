[package]
name = "saytype"
version = "0.2.1"
description = "A macOS push-to-talk speech-to-text app"
edition = "2021"

[lib]
name = "saytype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "fs", "macros", "rt", "time"] }

# Audio recording
cpal = "0.18"
hound = "3.5"
rubato = "5"
audioadapter-buffers = "5"

# HTTP client for remote transcription
reqwest = { version = "0.13", features = ["json"] }

# Lazy initialization
lazy_static = "1.5"

# Git pin: every published 2.x needs a fully yanked zip (^2 or ^4); back to version = "2" once tauri-apps/plugins-workspace#3698 ships
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfadc4c868c9a7e1a226c83af528e1f11b89", version = "2.14.0" }
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"
windows = { version = "0.62", features = [
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
] }
