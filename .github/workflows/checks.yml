name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Type check (TypeScript)
        run: pnpm tsc --noEmit

      - name: Check (format + lint, Biome)
        run: pnpm biome check

      - name: Build check (Vite)
        run: pnpm build

      # Catches a broken capture on the PR instead of at release time
      - name: Screenshot capture
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm screenshots "$RUNNER_TEMP/screenshots"

  rust:
    name: Rust (macOS)
    runs-on: macos-15
    env:
      SAYTYPE_REQUIRE_FOUNDATION_MODELS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Same selection as .github/actions/build-macos, so clippy sees the Swift bridge
      - name: Select newest stable Xcode
        run: sudo xcode-select -s "$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_[0-9.]+\.app' | sort -V | tail -1)"

      # PR caches can't be read by other PRs and only fill the 10 GB repo cache
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Create dummy sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/transcribe-server-aarch64-apple-darwin

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # otherwise Windows only compiles in release, where a break blocks the macOS release
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build:
    name: Build & E2E
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Parakeet weights are ~1.2GB and immutable.
      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-parakeet-tdt-0.6b-v3

      # Also runs both E2E suites: the sidecar is built once here (inside
      # build-macos), so a separate E2E job would rebuild the identical
      # binary on a second runner and pin its own Python version that could
      # drift from the one the shipped binary is built with.
      - name: Build macOS app
        uses: ./.github/actions/build-macos

      # Runs the frozen binary in all three modes the Rust side speaks:
      # --transcribe, stdin/stdout IPC, and --http. PyInstaller breakage
      # (missing hidden imports, missing MLX data files) only shows up here.
      - name: E2E — sidecar protocol and transcription
        timeout-minutes: 25
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          python3 tests/e2e/sidecar_e2e.py "src-tauri/binaries/transcribe-server-$TRIPLE"

      # Exercises the real bundle: sidecar lookup inside Saytype.app, spawn,
      # ready handshake, and the full Rust -> Python -> Rust round trip.
      - name: E2E — bundled app transcribes fixture
        timeout-minutes: 25
        run: ./tests/e2e/app_e2e.sh

  python:
    name: Python
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install ruff pyright -r sidecar/requirements.txt

      - name: Lint check
        run: |
          source .venv/bin/activate
          ruff check sidecar/ tests/

      - name: Format check
        run: |
          source .venv/bin/activate
          ruff format --check sidecar/ tests/

      - name: Type check (Pyright)
        run: |
          source .venv/bin/activate
          pyright
