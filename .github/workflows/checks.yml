name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Type check (TypeScript)
        run: pnpm tsc --noEmit

      - name: Format check (Prettier)
        run: pnpm prettier --check "src/**/*.{ts,tsx,css}"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libasound2-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create dummy sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/transcribe-server-x86_64-unknown-linux-gnu

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  python:
    name: Python
    runs-on: [self-hosted, macos, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install ruff pyright -r sidecar/requirements.txt

      - name: Lint check
        run: |
          source .venv/bin/activate
          ruff check sidecar/

      - name: Format check
        run: |
          source .venv/bin/activate
          ruff format --check sidecar/

      - name: Type check (Pyright)
        run: |
          source .venv/bin/activate
          pyright
