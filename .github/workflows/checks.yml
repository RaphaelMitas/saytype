name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Type check (TypeScript)
        run: pnpm tsc --noEmit

      - name: Check (format + lint, Biome)
        run: pnpm biome check src/

      - name: Build check (Vite)
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libasound2-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create dummy sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/transcribe-server-x86_64-unknown-linux-gnu

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build & E2E
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Parakeet weights are ~1.2GB and immutable.
      - name: Cache HuggingFace model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-parakeet-tdt-0.6b-v3

      # Also runs both E2E suites: the sidecar is built once here (inside
      # build-macos), so a separate E2E job would rebuild the identical
      # binary on a second runner and pin its own Python version that could
      # drift from the one the shipped binary is built with.
      - name: Build macOS app
        uses: ./.github/actions/build-macos

      # Runs the frozen binary in all three modes the Rust side speaks:
      # --transcribe, stdin/stdout IPC, and --http. PyInstaller breakage
      # (missing hidden imports, missing MLX data files) only shows up here.
      - name: E2E — sidecar protocol and transcription
        timeout-minutes: 25
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          python3 tests/e2e/sidecar_e2e.py "src-tauri/binaries/transcribe-server-$TRIPLE"

      # Exercises the real bundle: sidecar lookup inside Saytype.app, spawn,
      # ready handshake, and the full Rust -> Python -> Rust round trip.
      - name: E2E — bundled app transcribes fixture
        timeout-minutes: 25
        run: ./tests/e2e/app_e2e.sh

  python:
    name: Python
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install ruff pyright -r sidecar/requirements.txt

      - name: Lint check
        run: |
          source .venv/bin/activate
          ruff check sidecar/ tests/

      - name: Format check
        run: |
          source .venv/bin/activate
          ruff format --check sidecar/ tests/

      - name: Type check (Pyright)
        run: |
          source .venv/bin/activate
          pyright
