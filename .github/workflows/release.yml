name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release'
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-15  # ARM64 runner (Apple Silicon)
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build macOS app
        uses: ./.github/actions/build-macos
        with:
          tag: ${{ steps.tag.outputs.TAG }}

      - name: Import certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Find signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Sign app
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Saytype.app"

          # Sign the sidecar binary first
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/transcribe-server"

          # Sign the main app with entitlements and hardened runtime
          codesign --force --deep --options runtime --sign "$SIGNING_IDENTITY" --entitlements src-tauri/entitlements.plist "$APP_PATH"

          # Verify signing
          codesign --verify --verbose "$APP_PATH"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Saytype.app"

          # Create zip for notarization
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Saytype-notarize.zip"

          # Submit for notarization
          xcrun notarytool submit "$RUNNER_TEMP/Saytype-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "$APP_PATH"

      - name: Create release zip
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r Saytype-${{ steps.version.outputs.VERSION }}.zip Saytype.app

      # Not Tauri's createUpdaterArtifacts: that archives the app before the signing steps above
      - name: Create updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle/macos
          tar --no-mac-metadata -czf "$BUNDLE_DIR/Saytype.app.tar.gz" -C "$BUNDLE_DIR" Saytype.app
          pnpm tauri signer sign --app-version "${{ steps.version.outputs.VERSION }}" "$BUNDLE_DIR/Saytype.app.tar.gz"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            src-tauri/target/release/bundle/macos/Saytype-${{ steps.version.outputs.VERSION }}.zip
            src-tauri/target/release/bundle/macos/Saytype.app.tar.gz
            src-tauri/target/release/bundle/macos/Saytype.app.tar.gz.sig

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Resolve tag name
        id: tag
        shell: bash
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync app version from tag
        run: node scripts/set-version-from-tag.mjs "${{ steps.tag.outputs.TAG }}"

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload Windows artifact (MSI)
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows artifact (NSIS)
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

  # macOS so the UI renders in the system font, as it does in the app
  screenshots:
    runs-on: macos-15
    # A failed capture shouldn't hold back signed builds and the Homebrew tap
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Capture settings screenshots
        run: pnpm screenshots "$RUNNER_TEMP/screenshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots/*.png

  release:
    needs: [build-macos, build-windows, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level so the tap-dispatch step can guard on it: neither `secrets`
      # nor a step's own `env` are usable in a step-level `if`.
      TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The README links releases/latest, so a release without screenshots would break it
      - name: Reuse previous screenshots if capture failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d artifacts/screenshots ]; then
            gh release download -R "$GITHUB_REPOSITORY" -p 'screenshot-*.png' -D artifacts/screenshots \
              || echo "::warning::No new screenshots and none in the previous release"
          fi

      # The app polls releases/latest/download/latest.json for updates
      - name: Write update manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Saytype.app.tar.gz" \
            --arg signature "$(cat artifacts/macos-release/Saytype.app.tar.gz.sig)" \
            '{version: $version, pub_date: $pub_date, platforms: {"darwin-aarch64": {url: $url, signature: $signature}}}' \
            > artifacts/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/latest.json
            artifacts/macos-release/*
            artifacts/windows-release-msi/*
            artifacts/windows-release-nsis/*
            artifacts/screenshots/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tap constructs the asset name as <repo>-<version>.zip, i.e.
      # saytype-X.Y.Z.zip; GitHub resolves release asset names
      # case-insensitively, so that matches the Saytype-X.Y.Z.zip we upload.
      - name: Update Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh workflow run update-cask.yml -R RaphaelMitas/homebrew-tap \
            -f cask_name=saytype \
            -f release_tag="$TAG" \
            -f source_repo=RaphaelMitas/saytype
