name: Build macOS
description: Setup toolchains, build sidecar, and build Tauri app

inputs:
  tag:
    description: "Git tag for version sync (optional, skipped if empty)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # Post-processing needs the FoundationModels SDK from Xcode 26 or later
    - name: Select newest stable Xcode
      shell: bash
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"

    - name: Build sidecar
      shell: bash
      run: cd sidecar && ./build.sh

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Sync app version from tag
      if: inputs.tag != ''
      shell: bash
      run: node scripts/set-version-from-tag.mjs "${{ inputs.tag }}"

    - name: Build Tauri app
      shell: bash
      env:
        SAYTYPE_REQUIRE_FOUNDATION_MODELS: "1"
      run: pnpm tauri build
